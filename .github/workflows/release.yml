name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# Back-to-back merges used to run in parallel, compute the same version and
# race to push the same tag. Run one at a time so each sees the previous tag.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   
          
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.3.0'

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Show Version Info
        run: |
          echo "SemVer: ${{ steps.version_step.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.version_step.outputs.fullSemVer }}"
          echo "InformationalVersion: ${{ steps.version_step.outputs.informationalVersion }}"
      
      - name: Create and push Git tag 
        run: |
          TAG="v${{ steps.version_step.outputs.MajorMinorPatch }}"
          echo "Planned tag: $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # tag adnotowany (lepszy do historii)
          git tag -a "$TAG" -m "Release $TAG"
          if ! git push origin "$TAG"; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG was pushed concurrently. Skipping."
              exit 0
            fi
            exit 1
          fi

          echo "Pushed tag $TAG"
