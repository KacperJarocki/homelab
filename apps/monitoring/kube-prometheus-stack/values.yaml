# Alerts (rules in manifests/alert-rules.yaml) go to the self-hosted ntfy in
# this namespace. The publish token is in the alertmanager-ntfy Secret
# (scripts/create-alerting-secrets.sh), mounted under /etc/alertmanager/secrets.
alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - alertmanager-ntfy
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # Replaces the chart's default sub-route to a "null" receiver for the
      # Watchdog alert (default rules are off, and "null" is not defined here).
      routes: []
    receivers:
      - name: ntfy
        webhook_configs:
          # ntfy formats the payload with its own template (homelab.yml in
          # apps/monitoring/ntfy/manifests/configmap.yaml); tapping the
          # notification opens the Homelab / Alerts dashboard.
          - url: "http://ntfy.monitoring.svc.cluster.local/homelab-alerts?template=homelab&click=https%3A%2F%2Fgrafana.homelab.kacperjarocki.dev%2Fd%2Fhomelab-alerts"
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token
    inhibit_rules:
      # A node that is down explains everything else failing on it.
      - source_matchers: ['alertname = "NodeNotReady"']
        target_matchers: ['severity = "warning"']
        equal: ["node"]

defaultRules:
  create: false

grafana:
  enabled: true
  # Admin login from a Secret outside Helm (scripts/create-grafana-admin-secret.sh).
  # Without it the chart generates a random password and keeps it with a Helm
  # `lookup`, which Argo CD does not run: every sync wrote a new password to
  # the Secret while Grafana's database kept the first one, so neither the
  # Secret's password nor the dashboard sidecar could log in.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'grafana-dashboards-kubernetes'
          orgId: 1
          folder: 'Kubernetes'
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
  dashboards:
    grafana-dashboards-kubernetes:
      k8s-system-api-server:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
        token: ''
      k8s-system-coredns:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
        token: ''
      k8s-views-global:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
        token: ''
      k8s-views-namespaces:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
        token: ''
      k8s-views-nodes:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
        token: ''
      k8s-views-pods:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json

  ingress:
    enabled: true
    hosts:
      - grafana.homelab.kacperjarocki.dev
    path: /
    pathType: Prefix
    tls:
      - hosts:
          - grafana.homelab.kacperjarocki.dev
        secretName: monitoring-homelab-kacperjarocki-dev-tls

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi

  # The data volume is ReadWriteOnce: a rolling update starts the new pod on
  # another node while the old one still holds the volume, and it waits in
  # Init forever (Multi-Attach). Stop the old pod first.
  deploymentStrategy:
    type: Recreate

  initChownData:
    enabled: true

  serviceAccount:
    create: true
    autoMount: true

  sidecar:
    dashboards:
      enabled: true
    datasources:
      # Show the PrometheusRule alerts under Alerting > Alert rules
      # (data source-managed) and link them to our Alertmanager for silences.
      extraJsonData:
        manageAlerts: true
        alertmanagerUid: alertmanager

kubelet:
  enabled: true
  namespace: kube-system
  jobNameOverride: "k3s-server"
  serviceMonitor:
    enabled: false

kubeControllerManager:
  enabled: true
  jobNameOverride: "k3s-server"
  serviceMonitor:
    enabled: false

kubeEtcd:
  enabled: true
  serviceMonitor:
    enabled: false

kubeScheduler:
  enabled: true
  jobNameOverride: "k3s-server"
  serviceMonitor:
    enabled: false

kubeProxy:
  enabled: true
  jobNameOverride: "k3s-server"
  serviceMonitor:
    enabled: false

kube-state-metrics:
  enabled: true
  releaseLabel: true
  prometheusScrape: true
  prometheus:
    monitor:
      enabled: false
nodeExporter:
  enabled: true
  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: false
    darwin:
      enabled: false
  forceDeployDashboards: false

prometheus-node-exporter:
  namespaceOverride: ""
  podLabels:
    jobLabel: node-exporter
  releaseLabel: true
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
  prometheus:
    monitor:
      enabled: false
  service:
    portName: http-metrics
    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"
    labels:
      jobLabel: node-exporter

prometheusOperator:
  enabled: true
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader

prometheus:
  enabled: true
  prometheusSpec:
    retention: 3d
    retentionSize: 4GB
    scrapeInterval: 60s
    evaluationInterval: 60s

    enableRemoteWriteReceiver: true
    enableOTLPReceiver: false

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    serviceMonitorSelector: {}
    podMonitorSelector: {}
    probeSelector: {}
    ruleSelector: {}

    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

  ingress:
    enabled: true
    ingressClassName: ""
    extraLabels: {}
    hosts:
      - prometheus.homelab.kacperjarocki.dev
    path: /
    pathType: Prefix
    tls:
      - secretName: monitoring-homelab-kacperjarocki-dev-tls
        hosts:
          - prometheus.homelab.kacperjarocki.dev

  additionalScrapeConfigs: []
