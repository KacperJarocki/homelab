# Homelab alerts, delivered by Alertmanager to the self-hosted ntfy. A small
# set instead of the chart's default rules: those assume scrape jobs and
# components (kubelet, etcd, controller-manager) this k3s setup does not
# scrape and would mostly be noise. Metric names are unique to
# kube-state-metrics / node-exporter, so no job matchers are needed.
# Node rules exclude group="firewall": Alloy also scrapes the OPNsense
# node-exporter (once per Alloy pod) with the same metric names.
#
# Annotations, as rendered by the ntfy template (apps/monitoring/ntfy):
#   title       what is wrong and where, by name; the notification title
#   summary     current numbers, shown while firing
#   description what it means / where to look
# node-exporter series only carry instance="<ip>:9100"; the node rules join
# node_uname_info to add the hostname as `node` (same label as the
# kube-state-metrics rules, so the NodeNotReady inhibition matches them too).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
spec:
  groups:
    - name: workloads
      rules:
        - alert: PodCrashLooping
          expr: max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m])) >= 1
          for: 10m
          labels:
            severity: critical
          annotations:
            title: "{{ $labels.pod }} keeps crashing"
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }} is in CrashLoopBackOff"
            description: "Check its logs and probes."
        - alert: PodRestartingOften
          expr: sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[30m])) > 3
          labels:
            severity: warning
          annotations:
            title: "{{ $labels.pod }} restarts often"
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}: {{ printf \"%.0f\" $value }} restarts in 30 min"
            description: "Probably a liveness probe or OOM kill, even if it is not crash-looping right now."
        - alert: PodNotRunning
          expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            title: "{{ $labels.pod }} is not running"
            summary: "Stuck in Pending / Unknown / Failed in {{ $labels.namespace }} for 15+ min"
            description: "Usually scheduling, image pull or a volume that does not attach."
        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_spec_replicas - kube_deployment_status_replicas_available > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            title: "{{ $labels.deployment }} is missing replicas"
            summary: "{{ $value }} replica(s) unavailable in {{ $labels.namespace }} for 15+ min"
            description: "Check why its pods are not ready."
        - alert: DaemonSetNotReady
          expr: kube_daemonset_status_desired_number_scheduled - kube_daemonset_status_number_ready > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            title: "{{ $labels.daemonset }} is not ready everywhere"
            summary: "{{ $value }} pod(s) not ready in {{ $labels.namespace }} for 15+ min"
            description: "E.g. the pi-agents sensor on the gateway."
        - alert: StatefulSetNotReady
          expr: kube_statefulset_replicas - kube_statefulset_status_replicas_ready > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            title: "{{ $labels.statefulset }} is missing replicas"
            summary: "{{ $value }} replica(s) not ready in {{ $labels.namespace }} for 15+ min"
            description: "Check its pods and volumes."
        - alert: JobFailed
          expr: kube_job_status_failed > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            title: "Job {{ $labels.job_name }} failed"
            summary: "In {{ $labels.namespace }}"
            description: "A Job or CronJob run ended in failure; see its pod logs."
    - name: nodes
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            title: "{{ $labels.node }} is down"
            summary: "The node has not reported Ready for 5+ min"
            description: "Its pods are being rescheduled. Check power and network."
        # A Raspberry Pi that resets (power, watchdog) is often back within
        # NodeNotReady's 5 min, so reboots would otherwise go unnoticed.
        - alert: NodeRebooted
          expr: |
            ((node_time_seconds{group!="firewall"} - node_boot_time_seconds{group!="firewall"}) < 900)
            * on (instance) group_left (node)
              label_replace(node_uname_info{group!="firewall"}, "node", "$1", "nodename", "(.*)")
          labels:
            severity: warning
          annotations:
            title: "{{ $labels.node }} rebooted"
            summary: "Up again for {{ $value | humanizeDuration }}"
            description: "Unplanned? Check the power supply (vcgencmd get_throttled) and journalctl -b -1 on the node."
        - alert: NodeFilesystemAlmostFull
          expr: |
            (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",group!="firewall"} / node_filesystem_size_bytes < 0.10)
            * on (instance) group_left (node)
              label_replace(node_uname_info{group!="firewall"}, "node", "$1", "nodename", "(.*)")
          for: 15m
          labels:
            severity: warning
          annotations:
            title: "Disk almost full on {{ $labels.node }}"
            summary: "{{ $labels.mountpoint }}: {{ $value | humanizePercentage }} free"
            description: "Less than 10 % free space."
        - alert: NodeMemoryLow
          expr: |
            (node_memory_MemAvailable_bytes{group!="firewall"} / node_memory_MemTotal_bytes < 0.10)
            * on (instance) group_left (node)
              label_replace(node_uname_info{group!="firewall"}, "node", "$1", "nodename", "(.*)")
          for: 15m
          labels:
            severity: warning
          annotations:
            title: "Low memory on {{ $labels.node }}"
            summary: "{{ $value | humanizePercentage }} of RAM available"
            description: "Less than 10 % available for 15+ min; pods may get OOM-killed."
        - alert: NodeHot
          expr: |
            (node_thermal_zone_temp{group!="firewall"} > 80)
            * on (instance) group_left (node)
              label_replace(node_uname_info{group!="firewall"}, "node", "$1", "nodename", "(.*)")
          for: 10m
          labels:
            severity: warning
          annotations:
            title: "{{ $labels.node }} is running hot"
            summary: "CPU at {{ printf \"%.0f\" $value }} °C"
            description: "The Raspberry Pi throttles at 85 °C; check the fan and airflow."
        - alert: NodeClockNotSynchronised
          expr: |
            (min_over_time(node_timex_sync_status{group!="firewall"}[10m]) == 0)
            * on (instance) group_left (node)
              label_replace(node_uname_info{group!="firewall"}, "node", "$1", "nodename", "(.*)")
          for: 10m
          labels:
            severity: warning
          annotations:
            title: "Clock out of sync on {{ $labels.node }}"
            summary: "NTP has not synchronised for 20+ min"
            description: "Logs and event times from this node may be wrong."
    - name: monitoring
      rules:
        - alert: KubeStateMetricsMissing
          expr: absent(kube_pod_info)
          for: 10m
          labels:
            severity: critical
          annotations:
            title: "Monitoring is blind to pods and nodes"
            summary: "No kube-state-metrics data in Prometheus for 10+ min"
            description: "Pod and node alerts cannot fire. Check kube-state-metrics, Alloy and the remote write."
        - alert: NodeExporterMissing
          expr: count(node_uname_info{group!="firewall"}) < 5
          for: 15m
          labels:
            severity: warning
          annotations:
            title: "Node metrics missing"
            summary: "Only {{ $value }} of 5 nodes report node-exporter metrics"
            description: "Node alerts (disk, memory, temperature) are blind for the missing nodes."
