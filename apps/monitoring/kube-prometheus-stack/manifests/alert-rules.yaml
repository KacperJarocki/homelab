# Homelab alerts, delivered by Alertmanager to the self-hosted ntfy. A small
# set instead of the chart's default rules: those assume scrape jobs and
# components (kubelet, etcd, controller-manager) this k3s setup does not
# scrape and would mostly be noise. Metric names are unique to
# kube-state-metrics / node-exporter, so no job matchers are needed.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
spec:
  groups:
    - name: workloads
      rules:
        - alert: PodCrashLooping
          expr: max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m])) >= 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash-looping"
            description: "The container keeps restarting and is in CrashLoopBackOff. Check its logs and probes."
        - alert: PodRestartingOften
          expr: sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[30m])) > 3
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | humanize }} times in 30 min"
            description: "Frequent restarts (e.g. a liveness probe killing it) even if it is not in CrashLoopBackOff right now."
        - alert: PodNotRunning
          expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has not been running for 15 min"
            description: "Pod is Pending, Unknown or Failed (scheduling, image pull, volume attach)."
        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_spec_replicas > kube_deployment_status_replicas_available
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: {{ $value }} of the desired replicas available"
            description: "Fewer replicas available than desired for 15 min."
        - alert: DaemonSetNotReady
          expr: kube_daemonset_status_desired_number_scheduled - kube_daemonset_status_number_ready > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.daemonset }}: {{ $value }} pods not ready"
            description: "DaemonSet pods not ready for 15 min (e.g. the pi-agents sensor on the gateway)."
        - alert: StatefulSetNotReady
          expr: kube_statefulset_replicas - kube_statefulset_status_replicas_ready > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.statefulset }}: {{ $value }} replicas not ready"
            description: "StatefulSet replicas not ready for 15 min."
        - alert: JobFailed
          expr: kube_job_status_failed > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
            description: "A Job (or CronJob run) ended in failure."
    - name: nodes
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not Ready"
            description: "The kubelet has not reported Ready for 5 min."
        - alert: NodeFilesystemAlmostFull
          expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"
            description: "Less than 10 % free space."
        - alert: NodeMemoryLow
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} memory available"
            description: "Less than 10 % memory available for 15 min."
        - alert: NodeHot
          expr: node_thermal_zone_temp > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} SoC at {{ $value | humanize }} °C"
            description: "The Raspberry Pi throttles at 85 °C; check cooling."
        - alert: NodeClockNotSynchronised
          expr: min_over_time(node_timex_sync_status[10m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} clock is not NTP-synchronised"
            description: "Event times from this node may be wrong."
    - name: monitoring
      rules:
        - alert: KubeStateMetricsMissing
          expr: absent(kube_pod_info)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "No kube-state-metrics data in Prometheus"
            description: "Pod and node alerts cannot fire. Check kube-state-metrics, Alloy and the remote write."
        - alert: NodeExporterMissing
          expr: count(node_uname_info) < 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Only {{ $value }} of 5 nodes report node-exporter metrics"
            description: "Node alerts are blind for the missing nodes."
