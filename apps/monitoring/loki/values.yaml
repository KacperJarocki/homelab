loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      # Chunks and the TSDB index live on the singleBinary PVC (Longhorn).
      # The previous period used an external S3 (rustfs.kacperjarocki.dev)
      # that stopped answering; its chunks are not readable any more.
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: false
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h
    volume_enabled: true
  ruler:
    enable_api: true
  storage:
    type: filesystem
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
minio:
  enabled: false

gateway:
  enabled: false
lokiCanary:
  enabled: false
memcached:
  enabled: false
chunksCache:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      cpu: 200m
      memory: 500Mi
resultsCache:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      cpu: 200m
      memory: 500Mi
memcachedExporter:
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      cpu: 200m
      memory: 500Mi

# Chart >= 7.5.0 fails to render when helm tests are on but lokiCanary is off.
test:
  enabled: false
