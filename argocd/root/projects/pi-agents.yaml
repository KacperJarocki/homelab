# Tenant project for the pi-agents repo. Its own app-of-apps (argocd/root/apps/pi-agents-root.yaml)
# pulls k8s/argocd/ from https://github.com/KacperJarocki/pi-agents.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pi-agents
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: IoT threat-detection platform from the pi-agents repository
  sourceRepos:
    - https://github.com/KacperJarocki/pi-agents.git
    - https://cloudnative-pg.github.io/charts
    # The chart URL ends with a slash and `*` does not match `/`; list it exactly.
    - https://downloads.apache.org/flink/flink-kubernetes-operator-1.16.1/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd          # the child Applications themselves
    - server: https://kubernetes.default.svc
      namespace: iot-security
    - server: https://kubernetes.default.svc
      namespace: iot-security-dev
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: strimzi-system
  # Operators ship CRDs and ClusterRoles.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
