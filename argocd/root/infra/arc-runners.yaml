# Wave 3: needs the ARC CRDs and controller (arc, wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        # Also the runner scale set name used in `runs-on:`.
        releaseName: homelab-arm64
        valueFiles:
          - $values/infra/arc-runners/values.yaml
    - repoURL: https://github.com/kacperjarocki/homelab.git
      targetRevision: main
      ref: values
      path: infra/arc-runners/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
