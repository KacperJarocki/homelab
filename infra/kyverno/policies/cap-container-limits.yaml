# Upper bound for container limits: cpu <= 4, memory <= 8Gi.
# Containers without limits are left to require-requests-limits.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: cap-container-limits
  annotations:
    policies.kyverno.io/title: Cap container limits
    policies.kyverno.io/category: Resources
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.20.0
spec:
  # Pod-only on purpose: no autogen to Deployments etc., so the mutation never
  # rewrites workload templates (would fight Argo CD self-heal) and validation
  # only ever sees Pods that have already been defaulted.
  autogen:
    podControllers:
      controllers: []
  validationActions: [Deny]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - argocd
            - cert-manager
            - kyverno-system
            - longhorn-system
            - external-secrets
            - networking
            - monitoring
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: tooBig
      expression: >-
        object.spec.containers.filter(c,
          (c.?resources.?limits.?cpu.hasValue() && quantity(c.resources.limits.cpu).isGreaterThan(quantity('4'))) ||
          (c.?resources.?limits.?memory.hasValue() && quantity(c.resources.limits.memory).isGreaterThan(quantity('8Gi')))
        ).map(c, c.name)
  validations:
    - expression: size(variables.tooBig) == 0
      messageExpression: >-
        'Container limits too large (max cpu 4, memory 8Gi) in container(s): ' + variables.tooBig.join(', ')
