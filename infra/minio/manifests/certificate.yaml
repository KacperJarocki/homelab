apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minio-console
  namespace: minio
spec:
  secretName: minio-console-tls
  issuerRef:
    name: letsencrypt-http-prod
    kind: ClusterIssuer
  commonName: minio.homelab.kacperjarocki.dev
  dnsNames:
    - minio.homelab.kacperjarocki.dev
