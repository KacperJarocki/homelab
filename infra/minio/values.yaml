# In-cluster S3 for Loki (and anything else that needs object storage).
# Root credentials and the loki user's key live in Secrets created outside Git:
#   kubectl -n minio create secret generic minio-root --from-literal=rootUser=... --from-literal=rootPassword=...
#   kubectl -n minio create secret generic minio-user-loki --from-literal=secretKey=...
mode: standalone
replicas: 1
existingSecret: minio-root

persistence:
  storageClass: longhorn
  size: 50Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Web console; the S3 API stays cluster-internal at minio.minio.svc.cluster.local:9000.
consoleIngress:
  enabled: true
  hosts:
    - minio.homelab.kacperjarocki.dev
  tls:
    - secretName: minio-console-tls
      hosts:
        - minio.homelab.kacperjarocki.dev

# Bucket, policy and user are created by the chart's post-install jobs.
buckets:
  - name: loki
    policy: none
    purge: false

policies:
  - name: loki-readwrite
    statements:
      - resources:
          - "arn:aws:s3:::loki"
          - "arn:aws:s3:::loki/*"
        actions:
          - "s3:*"

users:
  - accessKey: loki
    existingSecret: minio-user-loki
    existingSecretKey: secretKey
    policy: loki-readwrite
