# Creates the buckets listed in BUCKETS once RustFS answers. Runs as an Argo CD
# PostSync hook after every sync of the rustfs Application; safe to rerun.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-buckets
  namespace: rustfs
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: amazon/aws-cli:2.17.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              endpoint="http://rustfs-svc.rustfs.svc.cluster.local:9000"
              for bucket in $BUCKETS; do
                aws --endpoint-url "$endpoint" s3api head-bucket --bucket "$bucket" 2>/dev/null \
                  || aws --endpoint-url "$endpoint" s3api create-bucket --bucket "$bucket"
                echo "bucket $bucket ready"
              done
          env:
            - name: BUCKETS
              value: "loki tofu-state"
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
