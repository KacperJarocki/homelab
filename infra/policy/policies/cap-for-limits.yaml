apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cap-container-limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: cap-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - cert-manager
                - kyverno-system
                - longhorn-system
                - external-secrets
                - networking
                - monitoring
      validate:
        message: "Container limits are missing or too large (cpu > 4, memory > 8Gi)."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.limits.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.cpu }}"
                    operator: GreaterThan
                    value: "4"
                  - key: "{{ element.resources.limits.memory }}"
                    operator: GreaterThan
                    value: "8Gi"
