# Falco: runtime threat detection for every container on every node (DaemonSet).
# It watches syscalls through the modern eBPF probe (kernel 6.8 with BTF on all
# nodes, nothing is compiled or loaded as a module) and matches them against
# the upstream falco-rules ruleset (shell in a container, writes below /etc,
# reading /etc/shadow, dropping and executing a new binary, crypto miners, ...).
#
# Where the events go:
#   Loki     every event is one JSON line on Falco's stdout, collected by Alloy
#            like any pod log. Grafana Explore:
#              {namespace="falco", container="falco"} | json | priority=~"Critical|Error|Warning"
#   Alerts   Falco -> Falcosidekick (http_output, wired by the chart) -> its
#            /metrics (falcosecurity_falcosidekick_falco_events_total, labels
#            rule, priority_raw, k8s_ns_name, k8s_pod_name, hostname) -> the
#            Falco* rules in apps/monitoring/kube-prometheus-stack/manifests/
#            alert-rules.yaml -> Alertmanager -> ntfy homelab-security
#            (critical ones: homelab-critical).
# Falcosidekick's own Loki output stays off: the stdout path already delivers
# every event, enabling both would store each one twice.

driver:
  kind: modern_ebpf

# Container metadata (container name, image, k8s.ns.name, k8s.pod.name) comes
# from the k3s containerd CRI socket; the k8smeta collector is not needed for
# that and stays off. Only enable the engines that exist here.
collectors:
  containerEngine:
    engines:
      docker:
        enabled: false
      podman:
        enabled: false
      lxc:
        enabled: false
      libvirt_lxc:
        enabled: false
      bpm:
        enabled: false
      containerd:
        enabled: false
      cri:
        enabled: true
        sockets: ["/run/k3s/containerd/containerd.sock"]

falco:
  # informational/debug rules are mostly noise; notice keeps "Terminal shell
  # in container" and friends.
  priority: notice
  # Every event already goes to stdout (Loki) and http (Falcosidekick).
  syslog_output:
    enabled: false

# Raspberry Pi 5, 8 GB. Falco with the modern probe uses ~150-250 MiB per node.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# falcoctl installs the ruleset at start and the sidecar pulls new versions of
# the same major (falco-rules:5) weekly. Kyverno require-requests-limits.
falcoctl:
  artifact:
    install:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    follow:
      resources:
        requests:
          cpu: 5m
          memory: 24Mi
        limits:
          cpu: 100m
          memory: 64Mi

falcosidekick:
  enabled: true
  # Only the Prometheus endpoint is used; one replica keeps the counters in
  # one place.
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  serviceMonitor:
    enabled: true
  webui:
    enabled: false
